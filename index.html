<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Cerita - Diary Estetis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Tema Cerah & Kalem (Pastel Sage Green & Cream) */
            --bg-color: #f7f9f6;
            --card-bg: #ffffff;
            --text-main: #3a4742;
            --text-muted: #70807a;
            --primary: #9cbda7; /* Sage Green */
            --primary-hover: #81a88e;
            --accent: #f4e8c1; /* Soft Cream/Yellow */
            --border-color: #e3eae6;
            --shadow: 0 8px 24px rgba(156, 189, 167, 0.15);
            --input-bg: #fafbfc;
        }

        [data-theme="dark"] {
            /* Tema Gelap & Kalem (Muted Slate & Deep Forest) */
            --bg-color: #1a2321;
            --card-bg: #242e2b;
            --text-main: #e1eae6;
            --text-muted: #9bb0a8;
            --primary: #5d7e68;
            --primary-hover: #72967e;
            --accent: #d9c589;
            --border-color: #313d39;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            --input-bg: #1c2422;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        header h1 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Grid Layout */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            align-items: start;
        }

        /* Card Base */
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .card h2 {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text-main);
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input, textarea, select {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(156, 189, 167, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-size: 1.05rem; /* Ukuran font nyaman baca */
        }

        /* Image Import Container */
        .file-upload-wrapper {
            position: relative;
            border: 2px dashed var(--primary);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            background: var(--input-bg);
            cursor: pointer;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }

        #imgPreview {
            max-width: 100%;
            max-height: 150px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
            object-fit: cover;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(156, 189, 167, 0.3);
        }

        .btn:hover { background: var(--primary-hover); }

        /* Recap & Filter Section */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .recap-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .recap-box {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .recap-box span {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Quicksand', sans-serif;
        }

        .recap-box label {
            font-size: 0.8rem;
        }

        /* Diary Entries List */
        .entry-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 5px;
        }

        .entry-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge {
            background: var(--accent);
            color: #5a4b1d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .entry-image {
            width: 100%;
            max-height: 300px;
            /* Perubahan: object-fit contain agar nampak utuh */
            object-fit: contain; 
            border-radius: 14px;
            margin: 12px 0;
            border: 1px solid var(--border-color);
        }

        .entry-text {
            font-size: 1.05rem; /* Nyaman untuk membaca cerita */
            color: var(--text-main);
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        .entry-location {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 15px;
        }

        .entry-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-action.delete:hover {
            background: #fce8e6;
            color: #c53030;
            border-color: #feb2b2;
        }

        .btn-action.edit:hover {
            background: var(--accent);
            color: #5a4b1d;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media(max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✒️ Ruang Cerita Saya</h1>
        <button id="themeToggle" class="theme-toggle">🌙</button>
    </header>

    <div class="main-grid">
        <div class="left-col">
            <div class="card">
                <h2 id="formTitle">Tulis Cerita Hari Ini</h2>
                <form id="diaryForm">
                    <div class="form-group">
                        <label for="waktu">Waktu & Tanggal</label>
                        <input type="datetime-local" id="waktu" required>
                    </div>

                    <div class="form-group">
                        <label for="kategori">Kategori Momen</label>
                        <select id="kategori">
                            <option value="📝 Harian">📝 Harian</option>
                            <option value="💡 Ide">💡 Ide</option>
                            <option value="✈️ Liburan">✈️ Liburan</option>
                            <option value="❤️ Asmara">❤️ Asmara</option>
                            <option value="💼 Pekerjaan">💼 Pekerjaan</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="lokasi">Lokasi</label>
                        <input type="text" id="lokasi" placeholder="Cth: Kamar Tidur, Kafe Kopi">
                    </div>

                    <div class="form-group">
                        <label for="catatan">Isi Catatan</label>
                        <textarea id="catatan" placeholder="Bagaimana harimu berjalan? Tuangkan di sini..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Tambahkan Foto Momen</label>
                        <div class="file-upload-wrapper">
                            <span id="uploadPlaceholder">📸 Pilih Foto dari Galeri</span>
                            <input type="file" id="foto" accept="image/*">
                            <img id="imgPreview" alt="Preview Foto">
                        </div>
                    </div>

                    <button type="submit" class="btn" id="btnSubmit">Simpan Momen</button>
                    <button type="button" class="btn" id="btnCancel" style="background:#6c757d; margin-top:10px; display:none;">Batal Edit</button>
                </form>
            </div>
        </div>

        <div class="right-col">
            <div class="card">
                <h2>Cari & Rekap Momen</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Cari kata kunci cerita..." style="flex: 1;">
                </div>
                
                <div class="search-box">
                    <input type="month" id="filterBulanTahun" style="width: 100%;">
                </div>

                <div class="rekap-container">
                    <div class="recap-box">
                        <label>Bulan Ini</label>
                        <span id="recapBulan">0</span>
                        <label>Cerita</label>
                    </div>
                    <div class="recap-box">
                        <label>Tahun Ini</label>
                        <span id="recapTahun">0</span>
                        <label>Cerita</label>
                    </div>
                </div>
            </div>

            <div id="diaryEntriesContainer">
                </div>
        </div>
    </div>
</div>

<footer>
    &copy; <span id="year"></span> PT Arta Makmur Jaya Sentosa. Hak Cipta Dilindungi.
</footer>

<script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // 1. Kontrol Mode Gelap/Terang Otomatis Tanpa Tulisan
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('diary_theme') || 'light';
    
    html.setAttribute('data-theme', savedTheme);
    themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeToggle.addEventListener('click', () => {
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('diary_theme', newTheme);
        themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    });

    // 2. Setup Awal & State Aplikasi
    let diaryData = JSON.parse(localStorage.getItem('diary_entries')) || [];
    let editId = null;
    let base64ImageStr = "";

    // Set waktu input default ke waktu sekarang
    const setNowTime = () => {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('waktu').value = now.toISOString().slice(0, 16);
    };
    setNowTime();

    // Set default filter bulan ke bulan sekarang
    const filterBulanInput = document.getElementById('filterBulanTahun');
    const now = new Date();
    filterBulanInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    // 3. Handle Kompresi & Upload Gambar
    const fotoInput = document.getElementById('foto');
    const imgPreview = document.getElementById('imgPreview');
    const placeholder = document.getElementById('uploadPlaceholder');

    fotoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                // Kompresi gambar menggunakan Canvas agar muat di LocalStorage
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 500;
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                base64ImageStr = canvas.toDataURL('image/jpeg', 0.7); // Kualitas 70%
                imgPreview.src = base64ImageStr;
                imgPreview.style.display = 'block';
                placeholder.style.display = 'none';
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // 4. Render Data Diary, Pencarian, & Pemisahan Rekap
    const renderDiary = () => {
        const container = document.getElementById('diaryEntriesContainer');
        container.innerHTML = '';

        const searchQuery = document.getElementById('searchInput').value.toLowerCase();
        const selectedMonthYear = filterBulanInput.value; // Format: YYYY-MM
        const selectedYear = selectedMonthYear ? selectedMonthYear.substring(0, 4) : new Date().getFullYear().toString();

        let countBulan = 0;
        let countTahun = 0;

        // Hitung total rekap terpisah secara independen dari pencarian text
        diaryData.forEach(item => {
            const itemYear = item.waktu.substring(0, 4);
            const itemMonthYear = item.waktu.substring(0, 7);

            if (itemYear === selectedYear) {
                countTahun++;
            }
            if (itemMonthYear === selectedMonthYear) {
                countBulan++;
            }
        });

        // Tampilkan hasil rekap terpisah ke UI
        document.getElementById('recapBulan').textContent = countBulan;
        document.getElementById('recapTahun').textContent = countTahun;

        // Filter data untuk ditampilkan di List Catatan
        const filteredData = diaryData.filter(item => {
            const matchSearch = item.catatan.toLowerCase().includes(searchQuery) || 
                                item.lokasi.toLowerCase().includes(searchQuery) ||
                                item.kategori.toLowerCase().includes(searchQuery);
            const matchMonth = selectedMonthYear ? item.waktu.startsWith(selectedMonthYear) : true;
            return matchSearch && matchMonth;
        });

        if (filteredData.length === 0) {
            container.innerHTML = `<div class="card" style="text-align:center; color: var(--text-muted);">Tidak ada cerita ditemukan pada bulan ini.</div>`;
            return;
        }

        filteredData.forEach(item => {
            // Format waktu tampilan yang cantik
            const opsiWaktu = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            const tanggalCantik = new Date(item.waktu).toLocaleDateString('id-ID', opsiWaktu);

            const div = document.createElement('div');
            div.className = 'entry-card';
            div.innerHTML = `
                <div class="entry-header">
                    <span class="entry-meta">📅 ${tanggalCantik}</span>
                    <span class="badge">${item.kategori}</span>
                </div>
                ${item.foto ? `<img src="${item.foto}" class="entry-image" alt="Momen">` : ''}
                <div class="entry-text">${item.catatan}</div>
                <div class="entry-location">📍 ${item.lokasi || 'Tidak ada lokasi'}</div>
                <div class="entry-actions">
                    <button class="btn-action edit" onclick="editEntry(${item.id})">Edit</button>
                    <button class="btn-action delete" onclick="deleteEntry(${item.id})">Hapus</button>
                </div>
            `;
            container.appendChild(div);
        });
    };

    // 5. Create & Update (Submit Form)
    document.getElementById('diaryForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const dataMomen = {
            id: editId ? editId : Date.now(),
            waktu: document.getElementById('waktu').value,
            kategori: document.getElementById('kategori').value,
            lokasi: document.getElementById('lokasi').value,
            catatan: document.getElementById('catatan').value,
            foto: base64ImageStr
        };

        if (editId) {
            const index = diaryData.findIndex(item => item.id === editId);
            if (index !== -1) diaryData[index] = dataMomen;
            resetFormState();
        } else {
            diaryData.push(dataMomen);
        }

        // Urutkan cerita berdasarkan waktu terbaru
        diaryData.sort((a, b) => new Date(b.waktu) - new Date(a.waktu));
        localStorage.setItem('diary_entries', JSON.stringify(diaryData));
        
        e.target.reset();
        clearUploadPreview();
        setNowTime();
        renderDiary();
    });

    // 6. Fitur Edit Data
    window.editEntry = (id) => {
        const item = diaryData.find(d => d.id === id);
        if (!item) return;

        document.getElementById('waktu').value = item.waktu;
        document.getElementById('kategori').value = item.kategori;
        document.getElementById('lokasi').value = item.lokasi;
        document.getElementById('catatan').value = item.catatan;
        
        if (item.foto) {
            base64ImageStr = item.foto;
            imgPreview.src = item.foto;
            imgPreview.style.display = 'block';
            placeholder.style.display = 'none';
        } else {
            clearUploadPreview();
        }

        editId = id;
        document.getElementById('formTitle').textContent = "✏️ Edit Momen Cerita";
        document.getElementById('btnSubmit').textContent = "Perbarui Cerita";
        document.getElementById('btnCancel').style.display = "inline-block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // 7. Fitur Hapus Data
    window.deleteEntry = (id) => {
        if (confirm('Apakah kamu yakin ingin menghapus kenangan cerita ini?')) {
            diaryData = diaryData.filter(item => item.id !== id);
            localStorage.setItem('diary_entries', JSON.stringify(diaryData));
            if (editId === id) resetFormState();
            renderDiary();
        }
    };

    // Batal Edit
    document.getElementById('btnCancel').addEventListener('click', () => {
        document.getElementById('diaryForm').reset();
        resetFormState();
        setNowTime();
    });

    const resetFormState = () => {
        editId = null;
        document.getElementById('formTitle').textContent = "Tulis Cerita Hari Ini";
        document.getElementById('btnSubmit').textContent = "Simpan Momen";
        document.getElementById('btnCancel').style.display = "none";
        clearUploadPreview();
    };

    const clearUploadPreview = () => {
        base64ImageStr = "";
        imgPreview.src = "";
        imgPreview.style.display = 'none';
        placeholder.style.display = 'block';
    };

    // Event Listener Filter & Pencarian Aktif
    document.getElementById('searchInput').addEventListener('input', renderDiary);
    filterBulanInput.addEventListener('change', renderDiary);

    // Muat data awal pertama kali dijalankan
    renderDiary();
</script>

</body>
</html>
