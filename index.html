<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Cerita</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header id="mainHeader" class="glowing-border">
            <div class="header-content" id="headerContent">
                <h1 class="shimmer-text">Ruang Cerita</h1>
                <div class="header-actions">
                    <button id="searchBtn" class="icon-btn" title="Cari Cerita"><i class="fas fa-search"></i></button>
                    <button id="themeToggle" class="icon-btn" title="Ganti Tema">🌙</button>
                </div>
            </div>
            <div class="search-overlay" id="searchOverlay">
                <input type="text" id="searchInput" placeholder="Cari momen, lokasi, atau kategori...">
                <button id="closeSearchBtn" class="icon-btn close-btn"><i class="fas fa-times"></i></button>
            </div>
        </header>

        <main class="main-content">
            <section id="tab-beranda" class="tab-pane active">
                <div class="filter-section">
                    <select id="filterBulanTahun" class="glowing-input">
                        <option value="">Tampilkan Semua Waktu</option>
                    </select>
                </div>
                <div id="diaryEntriesContainer" class="entries-grid"></div>
            </section>

            <section id="tab-tulis" class="tab-pane">
                <div class="card glowing-card form-card">
                    <h2 id="formTitle"><i class="fas fa-pen-nib"></i> Tulis Cerita Hari Ini</h2>
                    <form id="diaryForm">
                        <div class="form-group">
                            <label>Waktu & Tanggal</label>
                            <div class="datetime-dropdowns">
                                <select id="tgl_hari" class="glowing-input"></select>
                                <select id="tgl_bulan" class="glowing-input"></select>
                                <select id="tgl_tahun" class="glowing-input"></select>
                                <span class="time-separator"><i class="far fa-clock"></i></span>
                                <select id="tgl_jam" class="glowing-input"></select>
                                <span>:</span>
                                <select id="tgl_menit" class="glowing-input"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="kategori">Kategori Momen</label>
                            <select id="kategori" class="glowing-input">
                                <option value="📝 Harian">📝 Harian</option>
                                <option value="💡 Ide">💡 Ide</option>
                                <option value="✈️ Liburan">✈️ Liburan</option>
                                <option value="🏖️ Pantai">🏖️ Pantai</option>
                                <option value="❤️ Asmara">❤️ Asmara</option>
                                <option value="💼 Pekerjaan">💼 Pekerjaan</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="lokasi">Lokasi</label>
                            <input type="text" id="lokasi" class="glowing-input" placeholder="Cth: Pantai Kuta, Kafe Pinggir Laut">
                        </div>

                        <div class="form-group">
                            <label for="catatan">Isi Catatan</label>
                            <textarea id="catatan" class="glowing-input" placeholder="Bagaimana harimu berjalan? Dengar deburan ombaknya..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Tambahkan Foto Momen</label>
                            <div class="file-upload-wrapper glowing-border">
                                <span id="uploadPlaceholder"><i class="fas fa-camera"></i> Klik untuk Pilih Foto</span>
                                <input type="file" id="foto" accept="image/*">
                                <img id="imgPreview" alt="Preview Foto">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="btnSubmit">Simpan Momen</button>
                            <button type="button" class="btn btn-secondary" id="btnCancel" style="display:none;">Batal Edit</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <div class="bottom-fixed-wrapper">
            <nav class="bottom-nav glowing-border-top">
                <button class="nav-btn active" data-target="tab-beranda">
                    <i class="fas fa-water"></i> <span>Beranda</span>
                </button>
                <button class="nav-btn" data-target="tab-tulis">
                    <i class="fas fa-feather-alt"></i> <span>Tulis Cerita</span>
                </button>
            </nav>
            <footer>
                &copy; 2026 Aplikasi Ruang Cerita. All Rights Reserved. Powered by Arta Fortuna.
            </footer>
        </div>
    </div>

    <div id="diaryImageModal" class="custom-modal lightbox">
        <button class="close-modal-btn" id="closeLightboxBtn"><i class="fas fa-times"></i></button>
        <div class="lightbox-content">
            <img id="fullScreenImg" src="" alt="Full View Momen">
        </div>
    </div>

    <div id="customAlert" class="custom-modal custom-dialog">
        <div class="dialog-card glowing-card">
            <div class="dialog-icon text-primary"><i class="fas fa-info-circle"></i></div>
            <h3 id="alertTitle">Informasi</h3>
            <p id="alertMessage"></p>
            <button id="alertOkBtn" class="btn btn-primary">Mengerti</button>
        </div>
    </div>

    <div id="customConfirm" class="custom-modal custom-dialog">
        <div class="dialog-card glowing-card warning-card">
            <div class="dialog-icon text-danger"><i class="fas fa-exclamation-triangle"></i></div>
            <h3 id="confirmTitle">Konfirmasi</h3>
            <p id="confirmMessage"></p>
            <div class="dialog-actions">
                <button id="confirmCancelBtn" class="btn btn-secondary">Batal</button>
                <button id="confirmOkBtn" class="btn btn-danger">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
