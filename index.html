<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Cerita</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header id="mainHeader" class="glowing-border">
            <div class="header-content" id="headerContent">
                <h1 class="shimmer-text">Ruang Cerita</h1>
                <div class="header-actions">
                    <button id="searchBtn" class="icon-btn" title="Cari Cerita"><i class="fas fa-search"></i></button>
                    <button id="themeToggle" class="icon-btn" title="Ganti Tema">🌙</button>
                </div>
            </div>
            <div class="search-overlay" id="searchOverlay">
                <input type="text" id="searchInput" placeholder="Cari momen, lokasi, atau kategori...">
                <button id="closeSearchBtn" class="icon-btn close-btn"><i class="fas fa-times"></i></button>
            </div>
        </header>

        <main class="main-content">
            <section id="tab-beranda" class="tab-pane active">
                <div class="filter-section">
                    <select id="filterBulanTahun" class="glowing-input">
                        <option value="">Tampilkan Semua Waktu</option>
                    </select>
                </div>
                <div id="diaryEntriesContainer" class="entries-grid"></div>
            </section>

            <section id="tab-tulis" class="tab-pane">
                <div class="card glowing-card form-card">
                    <h2 id="formTitle"><i class="fas fa-pen-nib"></i> Tulis Cerita Hari Ini</h2>
                    <form id="diaryForm">
                        <div class="form-group">
                            <label>Waktu & Tanggal</label>
                            <div class="datetime-dropdowns">
                                <select id="tgl_hari" class="glowing-input"></select>
                                <select id="tgl_bulan" class="glowing-input"></select>
                                <select id="tgl_tahun" class="glowing-input"></select>
                                <span class="time-separator"><i class="far fa-clock"></i></span>
                                <select id="tgl_jam" class="glowing-input"></select>
                                <span>:</span>
                                <select id="tgl_menit" class="glowing-input"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="kategori">Kategori Momen</label>
                            <select id="kategori" class="glowing-input">
                                <option value="📝 Harian">📝 Harian</option>
                                <option value="💡 Ide">💡 Ide</option>
                                <option value="✈️ Liburan">✈️ Liburan</option>
                                <option value="🏖️ Pantai">🏖️ Pantai</option>
                                <option value="❤️ Asmara">❤️ Asmara</option>
                                <option value="💼 Pekerjaan">💼 Pekerjaan</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="lokasi">Lokasi</label>
                            <input type="text" id="lokasi" class="glowing-input" placeholder="Cth: Pantai Kuta, Kafe Pinggir Laut">
                        </div>

                        <div class="form-group">
                            <label for="catatan">Isi Catatan</label>
                            <textarea id="catatan" class="glowing-input" placeholder="Bagaimana harimu berjalan? Dengar deburan ombaknya..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Tambahkan Foto Momen</label>
                            <div class="file-upload-wrapper glowing-border">
                                <span id="uploadPlaceholder"><i class="fas fa-camera"></i> Klik untuk Pilih Foto</span>
                                <input type="file" id="foto" accept="image/*">
                                <img id="imgPreview" alt="Preview Foto">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="btnSubmit">Simpan Momen</button>
                            <button type="button" class="btn btn-secondary" id="btnCancel" style="display:none;">Batal Edit</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <div class="bottom-fixed-wrapper">
            <nav class="bottom-nav glowing-border-top">
                <button class="nav-btn active" data-target="tab-beranda">
                    <i class="fas fa-water"></i> <span>Beranda</span>
                </button>
                <button class="nav-btn" data-target="tab-tulis">
                    <i class="fas fa-feather-alt"></i> <span>Tulis Cerita</span>
                </button>
            </nav>
            <footer>
                &copy; 2026 Aplikasi Ruang Cerita. All Rights Reserved. Powered by Arta Fortuna.
            </footer>
        </div>
    </div>

    <div id="diaryImageModal" class="custom-modal lightbox">
        <button class="close-modal-btn" id="closeLightboxBtn"><i class="fas fa-times"></i></button>
        <div class="lightbox-content">
            <img id="fullScreenImg" src="" alt="Full View Momen">
        </div>
    </div>

    <div id="customAlert" class="custom-modal custom-dialog">
        <div class="dialog-card glowing-card">
            <div class="dialog-icon text-primary"><i class="fas fa-info-circle"></i></div>
            <h3 id="alertTitle">Informasi</h3>
            <p id="alertMessage"></p>
            <button id="alertOkBtn" class="btn btn-primary">Mengerti</button>
        </div>
    </div>

    <div id="customConfirm" class="custom-modal custom-dialog">
        <div class="dialog-card glowing-card warning-card">
            <div class="dialog-icon text-danger"><i class="fas fa-exclamation-triangle"></i></div>
            <h3 id="confirmTitle">Konfirmasi</h3>
            <p id="confirmMessage"></p>
            <div class="dialog-actions">
                <button id="confirmCancelBtn" class="btn btn-secondary">Batal</button>
                <button id="confirmOkBtn" class="btn btn-danger">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <script>
document.addEventListener('DOMContentLoaded', function() {
    try {
        // 1. EKSEKUSI DROPDOWN TANGGAL PERTAMA KALI (AMANTI CRASH)
        var dHari = document.getElementById('tgl_hari');
        var dBulan = document.getElementById('tgl_bulan');
        var dTahun = document.getElementById('tgl_tahun');
        var dJam = document.getElementById('tgl_jam');
        var dMenit = document.getElementById('tgl_menit');

        if(dHari && dBulan && dTahun && dJam && dMenit) {
            dHari.innerHTML = ''; dBulan.innerHTML = ''; dTahun.innerHTML = ''; dJam.innerHTML = ''; dMenit.innerHTML = '';
            
            for(let i=1; i<=31; i++) dHari.add(new Option(i, i < 10 ? '0'+i : i));
            
            const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            namaBulan.forEach((bln, idx) => dBulan.add(new Option(bln, (idx+1) < 10 ? '0'+(idx+1) : (idx+1))));
            
            const currentYear = new Date().getFullYear();
            for(let i=currentYear; i>=currentYear-10; i--) dTahun.add(new Option(i, i));
            
            for(let i=0; i<24; i++) dJam.add(new Option(i < 10 ? '0'+i : i, i < 10 ? '0'+i : i));
            for(let i=0; i<60; i++) dMenit.add(new Option(i < 10 ? '0'+i : i, i < 10 ? '0'+i : i));

            // Set ke Waktu Sekarang
            const now = new Date();
            dHari.value = now.getDate() < 10 ? '0'+now.getDate() : now.getDate();
            dBulan.value = (now.getMonth() + 1) < 10 ? '0'+(now.getMonth()+1) : (now.getMonth()+1);
            dTahun.value = now.getFullYear();
            dJam.value = now.getHours() < 10 ? '0'+now.getHours() : now.getHours();
            dMenit.value = now.getMinutes() < 10 ? '0'+now.getMinutes() : now.getMinutes();
        }

        // 2. STATE & VARIABEL
        let diaryData = [];
        let editId = null;
        let base64ImageStr = "";

        // 3. NAVIGASI TABS
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.getAttribute('data-target')).classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });

        // 4. UPLOAD FOTO
        const fotoInput = document.getElementById('foto');
        const imgPreview = document.getElementById('imgPreview');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');

        if(fotoInput) {
            fotoInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64ImageStr = event.target.result;
                    imgPreview.src = base64ImageStr;
                    imgPreview.style.display = 'block';
                    uploadPlaceholder.style.display = 'none';
                };
                reader.readAsDataURL(file);
            });
        }

        // 5. INDEXED DB (PENYIMPANAN AMAN & MIGRASI)
        const dbName = "RuangCeritaDB_Final";
        let db;

        const initDB = () => {
            const request = indexedDB.open(dbName, 1);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains("ceritaStore")) {
                    db.createObjectStore("ceritaStore", { keyPath: "id" });
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                
                // Cek & selamatkan data lama dari LocalStorage
                const oldData = localStorage.getItem('diary_entries');
                if (oldData) {
                    try {
                        const parsed = JSON.parse(oldData);
                        const tx = db.transaction(["ceritaStore"], "readwrite");
                        const store = tx.objectStore("ceritaStore");
                        parsed.forEach(item => store.put(item));
                        tx.oncomplete = () => {
                            localStorage.removeItem('diary_entries'); // Bersihkan sisa lama
                            loadDataFromDB();
                        };
                    } catch(err) { loadDataFromDB(); }
                } else {
                    loadDataFromDB();
                }
            };
            request.onerror = (e) => {
                alert("Browser tidak mendukung penyimpanan lokal.");
            };
        };

        const loadDataFromDB = () => {
            const tx = db.transaction(["ceritaStore"], "readonly");
            const store = tx.objectStore("ceritaStore");
            const request = store.getAll();
            request.onsuccess = () => {
                diaryData = request.result.sort((a, b) => new Date(b.waktu) - new Date(a.waktu));
                renderDiary();
            };
        };

        const saveDataToDB = (data) => {
            const tx = db.transaction(["ceritaStore"], "readwrite");
            const store = tx.objectStore("ceritaStore");
            store.put(data);
            tx.oncomplete = () => {
                alert("Momen Cerita Berhasil Disimpan!");
                loadDataFromDB();
            };
        };

        window.deleteEntry = (id) => {
            if(confirm("Yakin ingin menghapus cerita ini?")) {
                const tx = db.transaction(["ceritaStore"], "readwrite");
                const store = tx.objectStore("ceritaStore");
                store.delete(id);
                tx.oncomplete = () => loadDataFromDB();
            }
        };

        // 6. RENDER DATA KE BERANDA
        const renderDiary = () => {
            const container = document.getElementById('diaryEntriesContainer');
            if(!container) return;
            container.innerHTML = '';

            if (diaryData.length === 0) {
                container.innerHTML = `<div class="card glowing-card" style="text-align:center; grid-column: 1 / -1; padding:30px;">Belum ada cerita. Tulis momenmu sekarang!</div>`;
                return;
            }

            diaryData.forEach(item => {
                let tanggalCantik = item.waktu;
                try {
                    tanggalCantik = new Date(item.waktu).toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                } catch(e){}

                const div = document.createElement('div');
                div.className = 'entry-card';
                div.innerHTML = `
                    <div class="entry-header">
                        <span class="entry-meta">${tanggalCantik}</span>
                        <span class="badge">${item.kategori || ''}</span>
                    </div>
                    ${item.foto ? `<img src="${item.foto}" class="entry-image" style="object-fit:cover; height:150px; border-radius:8px;">` : ''}
                    <div class="entry-text" style="margin-top:10px;">${item.catatan || ''}</div>
                    ${item.lokasi ? `<div class="entry-location" style="margin-top:5px; color:#e07a5f; font-size:0.85rem;">📍 ${item.lokasi}</div>` : ''}
                    <div class="entry-actions" style="margin-top:15px; text-align:right;">
                        <button class="btn-sm delete" onclick="deleteEntry(${item.id})" style="padding:5px 10px; background:#e63946; color:#fff; border:none; border-radius:5px; cursor:pointer;">Hapus</button>
                    </div>
                `;
                container.appendChild(div);
            });
        };

        // 7. SUBMIT FORM
        const form = document.getElementById('diaryForm');
        if(form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const strWaktu = document.getElementById('tgl_tahun').value + "-" + 
                                 document.getElementById('tgl_bulan').value + "-" + 
                                 document.getElementById('tgl_hari').value + "T" + 
                                 document.getElementById('tgl_jam').value + ":" + 
                                 document.getElementById('tgl_menit').value;

                const dataMomen = {
                    id: Date.now(),
                    waktu: strWaktu,
                    kategori: document.getElementById('kategori').value,
                    lokasi: document.getElementById('lokasi').value,
                    catatan: document.getElementById('catatan').value,
                    foto: base64ImageStr
                };

                saveDataToDB(dataMomen);
                
                // Reset Form
                form.reset();
                base64ImageStr = "";
                imgPreview.src = "";
                imgPreview.style.display = 'none';
                uploadPlaceholder.style.display = 'block';

                // Balik ke beranda otomatis
                document.querySelector('[data-target="tab-beranda"]').click();
            });
        }

        // Jalankan DB
        initDB();

    } catch(err) {
        console.error("Gagal Render:", err);
        alert("Terjadi kesalahan sistem: " + err.message);
    }
});
</script>
</body>
</html>
